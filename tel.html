<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Type Tel</title>
</head>

<body style="font-family: sans-serif;">

    <!-- Input Type Tel -->

    <h1 style="color: red; text-align: center;">Input Type Tel</h1>

    <h2>Telephone Field</h2>

    <p>The <strong>input type="tel"</strong> is used for input fields that should contain a telephone number:</p>

    <form>
        <label for="phone">Enter a phone number:</label><br><br>
        <input type="tel" id="phone" name="phone" placeholder="123-45-678" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"
            required><br><br>
        <small>Format: 123-45-678</small><br><br>
        <input type="submit" value="Submit">
    </form>
    <br><br>

    <a href="index.html" style="text-decoration: none; color: red; border: 1px solid black; padding: 5px; border-radius: 5px; background-color: rgb(243, 238, 238);" >Go to main page</a>


</body>

</html>
