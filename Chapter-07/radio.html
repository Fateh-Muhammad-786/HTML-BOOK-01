<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Type Radio</title>
</head>
<body style="font-family: sans-serif;">

    <!-- Input Type Radio -->

    <h1 style="text-align: center; color: red;">Input Type Radio</h1>

    <p>Choose your favorite Web language:</p>

<form>
  <input type="radio" id="html" name="fav_language" value="HTML">
  <label for="html">HTML</label><br>
  <input type="radio" id="css" name="fav_language" value="CSS">
  <label for="css">CSS</label><br>
  <input type="radio" id="javascript" name="fav_language" value="JavaScript">
  <label for="javascript">JavaScript</label>
  <br><br>
  <input type="submit" value="Submit">
</form>
<br><br>

 <a href="index.html" style="text-decoration: none; color: red; border: 1px solid black; padding: 5px; border-radius: 5px; background-color: rgb(243, 238, 238);" >Go to main page</a>

    
</body>
</html>
