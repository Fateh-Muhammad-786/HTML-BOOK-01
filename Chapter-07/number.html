<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Type Number</title>
</head>

<body style="font-family: sans-serif;">

    <!-- Input Type Number -->

    <h1 style="color: red; text-align: center;">Input Type Number</h1>

    <form>
        <h2>Number Field</h2>

        <label for="quantity">Quantity (between 1 and 5):</label>
        <input type="number" id="quantity" name="quantity" min="1" max="5">
        <br><br>

        <h2>Numeric Steps</h2>
        
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="0" max="100" step="10" value="30">
        <br><br>
        <input type="submit" value="Submit">
    </form>
    <br><br>
    <a href="index.html"
        style="text-decoration: none; color: red; border: 1px solid black; padding: 5px; border-radius: 5px; background-color: rgb(243, 238, 238);">Go
        to main page</a>


</body>

</html>
